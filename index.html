<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TriTime</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TriTime">
<meta name="application-name" content="TriTime">
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
</head>
<body>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}[hidden]{display:none!important}
/* Layout: one phone-width column, cards on near-black, bottom tab bar with a floating "now training" bar above it */
:root{
  --bg:#0a0a0a; --card:#151515; --card2:#1c1c1c; --line:#262626; --line2:#323232;
  --fg:#f3f3ef; --muted:#8c8c86; --dim:#5d5d58;
  --lime:#c4ef6a; --lime-ink:#151a08; --lime-soft:rgba(196,239,106,.12); --lime-line:rgba(196,239,106,.35);
  --orange:#f0a24a; --orange-soft:rgba(240,162,74,.14);
  --sleep:#a9a2f6; --sleep-soft:rgba(169,162,246,.14);
  --swim:#6fc3e8; --bike:#c4ef6a; --run:#f0a24a; --lift:#c9b6f2; --race:#ff7a6b;
  --font:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
input{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 190px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.sub{color:var(--muted);font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
.hdr{display:flex;align-items:center;gap:12px;padding:4px 2px 2px}
.avatar{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#d8f58e,#7fa53a);color:var(--lime-ink);display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.hdr .name{font-size:20px;font-weight:800}
.streak{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px}
.streak svg{width:16px;height:16px}
.tier .gem{width:40px;height:44px;flex:none}
.tier .tname{font-size:21px;font-weight:800}
.tier .tof{font-size:12px;color:var(--muted);font-weight:600;margin-left:6px}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:14px}
.bar>i{display:block;height:100%;border-radius:5px}
.nextgem{width:18px;height:20px;opacity:.75}
.now{display:flex;align-items:center;gap:14px;width:100%}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{position:absolute;inset:0}
.ring .ic{position:absolute;inset:0;display:grid;place-items:center}
.ring .ic svg{position:static;width:22px;height:22px}
.now .t{font-weight:700;font-size:16px}
.now .clock{font-size:20px;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:11px 18px;font-weight:700;font-size:14px}
.btn.lime{background:var(--lime);color:var(--lime-ink)}
.btn.ghost{background:var(--card2);border:1px solid var(--line2)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn svg{width:14px;height:14px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;min-width:0}
.tile .tt{font-weight:600;font-size:15px;display:block}
.tile.ok{background:linear-gradient(180deg,rgba(196,239,106,.16),rgba(196,239,106,.07));border-color:var(--lime-line)}
.tile.ok .tt{color:#cfd8bd}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center}
.chk.on{background:var(--lime);border-color:var(--lime)}
.chk svg{display:none;width:13px;height:13px}
.chk.on svg{display:block}
.weekc{display:flex;align-items:center;gap:22px;padding:22px 20px}
.big{position:relative;width:150px;height:150px;flex:none}
.big .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.big .pct{font-size:26px;font-weight:800}
.legend{display:flex;flex-direction:column;gap:18px}
.legend .k{display:flex;align-items:center;gap:7px}
.legend .k i{width:7px;height:7px;border-radius:50%}
.legend .v{font-size:26px;font-weight:800;margin-top:2px}
.legend .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.warn{display:flex;gap:12px;align-items:flex-start;background:var(--sleep-soft);border:1px solid rgba(169,162,246,.35);border-radius:18px;padding:14px 16px;font-size:14px;line-height:1.45}
.warn svg{width:20px;height:20px;flex:none;color:var(--sleep);margin-top:1px}

/* session rows */
.sess{display:flex;flex-direction:column;gap:8px}
.srow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 10px}
.srow .open{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.sic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.sic svg{width:21px;height:21px}
.stx{flex:1;min-width:0}
.stx .st{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stx .sd{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dur{font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.srow.done .st{color:var(--muted)}
.srow.done .sic{opacity:.45}
.srow .chk{margin-right:2px}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.restline{color:var(--muted);font-size:14px;padding:4px 0}
.race{display:flex;gap:14px;align-items:center}
.race .days{font-size:32px;font-weight:800;line-height:1}
.race .days small{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--lime-soft);color:var(--lime);white-space:nowrap}
.pill.o{background:var(--orange-soft);color:var(--orange)}

/* workouts tab */
.timeline{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px;margin-top:10px}
.timeline button{height:100%;border-radius:2px;min-width:3px}
.tlkey{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px}
.tlkey span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.tlkey i{width:8px;height:8px;border-radius:2px}
.wknav{display:flex;align-items:center;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line2);display:grid;place-items:center;flex:none}
.iconbtn svg{width:16px;height:16px}
.day{padding:14px}
.day .dh{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:0 2px}
.day .dn{font-weight:800;font-size:15px}
.day.today{border-color:var(--lime-line)}
.dprog{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}

/* sleep */
.field{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field input{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:17px;font-weight:700}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.times label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.times input{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:3px;flex-wrap:wrap}
.seg button{padding:6px 11px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--lime);color:var(--lime-ink)}
.seg.s button[aria-pressed=true]{background:var(--sleep);color:#16142b}
.qual{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qual button{padding:9px 0;border-radius:12px;background:var(--card2);border:1px solid var(--line2);text-align:center;font-size:12px;font-weight:700;color:var(--muted)}
.qual button[aria-pressed=true]{background:var(--sleep);border-color:var(--sleep);color:#16142b}
.dur-big{font-size:34px;font-weight:800;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{display:flex;flex-direction:column;gap:3px}
.stats b{font-size:22px;font-weight:800}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-115%)}
ul.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;line-height:1.5;font-size:14px;color:#d6d6d0}

/* tables */
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap}
.ex{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ex:first-of-type{border-top:0}
.tests{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tests label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.tests input{background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:15px;width:100%}

/* nav + mini */
.dock{position:fixed;left:0;right:0;bottom:0;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
.dock>*{pointer-events:auto;max-width:456px;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;background:#121212;border:1px solid var(--line2);border-radius:18px;padding:10px 12px 10px 16px;margin-bottom:10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mini svg.fig{width:22px;height:22px;flex:none}
.mini .x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center}
.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#141414;border:1px solid var(--line2);border-radius:26px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 7px;border-radius:20px;font-size:11px;min-width:0;font-weight:600;color:#d0d0cc}
.nav button svg{width:26px;height:26px}
.nav button[aria-current=page]{background:#262626;color:var(--lime)}

/* session sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto}
.sheet .in{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:10px 0 4px}
.hero .sic{width:64px;height:64px;border-radius:20px}
.hero .sic svg{width:32px;height:32px}
.hero h2{font-size:26px}
.facts{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column}
.steps div{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.45}
.steps div:first-child{border-top:0}
.steps i{font-style:normal;color:var(--muted);font-weight:700;font-size:12px;width:18px;flex:none;padding-top:2px}
.bigclock{font-size:44px;font-weight:800;letter-spacing:-.02em}
.sring{position:relative;width:210px;height:210px;margin:6px auto 0}
.sring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.exl{display:flex;flex-direction:column}
.exl button{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.exl button:first-child{border-top:0}
.exl .cur{color:var(--lime)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.modal .box{width:100%;max-width:480px;background:var(--card);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.x{color:var(--muted);width:30px;height:30px;display:grid;place-items:center}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync.ok i{background:var(--lime)}
@media (max-width:380px){.weekc{gap:14px;padding:18px 14px}.big{width:124px;height:124px}.tile{padding:14px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* logging + progress */
.dur.logged{color:var(--fg);text-align:right;line-height:1.25}
.dur.logged small{display:block;color:var(--race);font-weight:700;font-size:11.5px}
.lpart{display:flex;flex-direction:column;gap:8px}
.lpart+.lpart{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.lph{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.lgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.lgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.lgrid .span2{grid-column:span 2}
.lgrid input{width:100%;min-width:0;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px;font-size:16px;font-weight:700}
.lgrid input::placeholder{color:var(--dim);font-weight:500}
.hms{display:flex;align-items:center;gap:6px}
.hms b{color:var(--muted)}
.ferr{color:var(--race);font-size:13px;min-height:0;margin-top:8px}
.ferr:empty{display:none}
.trow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tl{font-weight:700;font-size:14px}
.tv{font-size:17px;font-weight:800;margin-top:2px}
.pill.g{background:var(--card2);color:var(--muted)}
.pill.v{background:var(--sleep-soft);color:var(--sleep)}
.pill.r{background:rgba(255,122,107,.15);color:var(--race)}
.wkhrs{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:4px;font-size:14px}
.bblock{padding:12px 0;border-top:1px solid var(--line)}
.card>.bblock:nth-child(3),.eyebrow+.bblock{border-top:0}
.bhist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lrow{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.hrline{color:var(--race);font-size:12px;font-weight:600;margin-top:2px}
@media (max-width:380px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.lgrid .span2{grid-column:span 2}}

/* polish */
.card{background:linear-gradient(180deg,#171717,#131313);border-color:rgba(255,255,255,.07)}
.greet{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.streak{background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:6px 11px 6px 9px;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero-c{display:flex;flex-direction:column;gap:10px}
.hero-s{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px;scrollbar-width:none;-webkit-overflow-scrolling:touch;border:1px solid rgba(255,255,255,.07)}
.hero-s::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:400/230;max-width:100%;overflow:hidden;cursor:default}
.slide[data-go]{cursor:pointer}
.slide svg{position:absolute;inset:0;width:100%;height:100%}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.72) 100%)}
.cap{position:absolute;left:18px;right:18px;bottom:16px;color:#fff}
.cap .eyebrow{color:rgba(255,255,255,.75)}
.htitle{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-top:4px;text-wrap:balance}
.hsub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:4px}
.hchip{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.dots{display:flex;justify-content:center;gap:6px}
.dots button{width:6px;height:6px;border-radius:6px;background:var(--line2);transition:width .25s,background .25s}
.dots button.on{width:20px;background:var(--lime)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 2px 0}
.sech{font-size:17px;font-weight:800;letter-spacing:-.01em}
.now .t{font-size:17px;margin-top:2px}
.logbtn{display:inline-flex;align-items:center;gap:6px;background:var(--lime);color:var(--lime-ink);border-radius:999px;padding:8px 12px;font-weight:800;font-size:13px;flex:none}
.logbtn .num{opacity:.65;font-weight:700}
.logbtn svg{width:12px;height:12px}
.weekc .legend{gap:12px}
.weekc .legend .v{font-size:22px}
.big .pct{font-size:30px}
.nav{background:rgba(20,20,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
@media (prefers-reduced-motion:reduce){.hero-s{scroll-behavior:auto}}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.addph{position:absolute;top:14px;left:14px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;min-width:24px;height:24px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700;padding:0 6px}
.thumb button.armed{background:var(--race)}
.thumb button svg{width:12px;height:12px}
.recap .rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.recap .rgrid div{display:flex;flex-direction:column;gap:2px;min-width:0}
.recap .rgrid b{font-size:20px;font-weight:800}
.recap .rgrid small{color:var(--muted);font-size:11.5px;line-height:1.35}
.rnext{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.rhrl{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.rhrl input{width:110px;background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700}
.stats.s2{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:14px}
.placel{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.ready{display:flex;align-items:center;gap:12px;width:100%;border-left-width:1px}
.ready .rdot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:4px;background:var(--dim);box-shadow:0 0 0 5px rgba(255,255,255,.04)}
.rd-go .rdot{background:var(--lime);box-shadow:0 0 0 5px var(--lime-soft)}
.rd-easy .rdot{background:var(--orange);box-shadow:0 0 0 5px var(--orange-soft)}
.rd-rest .rdot{background:var(--race);box-shadow:0 0 0 5px rgba(255,122,107,.15)}
.rd-go{border-color:var(--lime-line)} .rd-easy{border-color:rgba(240,162,74,.35)} .rd-rest{border-color:rgba(255,122,107,.4)}
.rt{display:block;font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.rd-go .rt{color:var(--lime)} .rd-easy .rt{color:var(--orange)} .rd-rest .rt{color:var(--race)}
.rd-none svg{width:14px;height:14px;color:var(--muted);flex:none}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.rc{font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.rc.ok{color:var(--lime);border-color:var(--lime-line)} .rc.meh{color:var(--orange);border-color:rgba(240,162,74,.35)} .rc.bad{color:var(--race);border-color:rgba(255,122,107,.4)}
.nbench{display:flex;flex-direction:column;gap:8px}
.nbrow{display:flex;align-items:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px}
.nbv{text-align:right;font-weight:800;font-size:15px}
.nbv small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.rbk{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);font-size:13.5px}
.chk.ro{opacity:.55}
.chk.ro:not(.on){border-style:dashed}
.lockn{display:flex;align-items:center;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

const idbDo=(mode,fn)=>idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction("photos",mode),st=tx.objectStore("photos");const q=fn(st);tx.oncomplete=()=>res(q&&q.result);tx.onerror=()=>rej(tx.error)}));

function photoURL(id){
  if(window.claude) return "/_blob/"+id;
  if(photoURLs[id]) return photoURLs[id];
  if(photoURLs[id]===undefined){photoURLs[id]="";idbDo("readonly",st=>st.get(id)).then(b=>{if(b){photoURLs[id]=URL.createObjectURL(b);render()}}).catch(()=>{})}
  return "";
}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error("encode")),"image/jpeg",.82)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("read"))};im.src=u})}
let photoMsg="", photoRace=null, delArm=null;
async function addPhotos(race,files){
  if(!assetsNS||!files.length) return;
  photoMsg="Uploading "+files.length+" photo"+(files.length>1?"s":"")+"…"; render();
  const ids=[];let failed=0;
  for(const f of files){try{const b=await shrink(f);const r=await assetsNS.upload(b,{type:"image/jpeg"});ids.push(r.id)}catch(e){failed++}}
  if(ids.length){S.settings.photos=S.settings.photos||{};S.settings.photos[race]=[...racePhotos(race),...ids];persist("settings")}
  photoMsg=failed?failed+" photo"+(failed>1?"s":"")+" couldn't be added. Try a JPEG or PNG under 20 MB.":"";
  heroIdx=0; render();
}
async function removePhoto(race,id){
  S.settings.photos[race]=racePhotos(race).filter(x=>x!==id); persist("settings"); render();
  try{await assetsNS.delete(id)}catch(e){}
}
(async()=>{
  if(!window.claude||!claude.use) return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user) return;
  const uid=await user.id(); if(!uid) return;
  dbCol=db.collection("data/users/"+uid);
  let first=true;
  dbCol.onSnapshot(snap=>{
    if(first&&snap.empty){Object.keys(S.days).forEach(d=>pend["d"+d]=true); pend.settings=true; flush();}
    first=false;
    snap.docs.forEach(d=>{ if(pend[d.id]) return; const v=d.data(); if(!v) return;
      if(d.id==="settings") S.settings=Object.assign({unit:"kg",sleepGoal:8},v);
      else if(d.id[0]==="d") S.days[d.id.slice(1)]=JSON.parse(JSON.stringify(v));
    });
    sync="ok"; saveLocal(); render();
  },()=>{sync="local";render()});

/* ---------- sleep ---------- */
const goal=()=>+S.settings.sleepGoal||8;
const QUAL=["Awful","Poor","OK","Good","Great"];
function sleepOf(s){return (S.days[s]||{}).sleep||null}
function hoursBetween(bed,wake){if(!bed||!wake)return null;const[a,b]=bed.split(":").map(Number),[c,d]=wake.split(":").map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m/60}
function fmtH(h){if(h==null)return "—";const m=Math.round(h*60);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"}
function badNight(e){return !!e&&(e.h<goal()-1.5||e.q<=2)}
function twoBad(){const a=sleepOf(T),b=sleepOf(addDays(T,-1)),c=sleepOf(addDays(T,-2));return a?badNight(a)&&badNight(b):badNight(b)&&badNight(c)}

/* ---------- scoring ---------- */
const TIERS=[["Bronze",0,"#b8764a"],["Silver",500,"#c4c4c4"],["Gold",1200,"#e7c35a"],["Platinum",2000,"#9fd6d2"],["Diamond",2900,"#8fb8ff"],["Elite",3800,"#c9b6f2"],["Master",4700,"#f0a24a"],["Champion",5600,"#ff7a6b"],["Ironman",6500,"#c4ef6a"]];
function isDone(s,k){return !!(S.days[s]&&S.days[s].done&&S.days[s].done[k])}
function points(){let p=0;for(const s in S.days){const d=S.days[s];if(d.done){const its=dayItems(s);for(const k in d.done){const it=its.find(x=>x.key===k);if(it)p+=it.type==="race"?150:10}}if(d.sleep&&d.sleep.h>=goal())p+=5}return p}
function tierInfo(){const p=points();let i=0;TIERS.forEach((t,j)=>{if(p>=t[1])i=j});return{p,i,t:TIERS[i],next:TIERS[i+1]}}
function dayStatus(s){const t=dayItems(s);return{n:t.length,d:t.filter(x=>isDone(s,x.key)).length}}
function streak(){let s=T,c=0;const st=dayStatus(s);if(st.n&&!st.d)s=addDays(s,-1);
  while(s>="2026-10-27"){const x=dayStatus(s);if(x.n===0){s=addDays(s,-1);continue}if(x.d===0)break;c++;s=addDays(s,-1)}return c}

function sessRows(s,compact=true){
  const info=dayInfo(s);
  if(!info.items.length&&!info.rest.length&&!info.notes.length) return `<div class="restline">Nothing planned.</div>`;
  const rows=info.items.map(it=>{const on=isDone(s,it.key);return `<div class="srow ${on?"done":""}">
    <button class="open" data-open="${s}|${it.key}" aria-label="Open ${esc(it.title)}">${sic(it)}<span class="stx"><span class="st" style="display:block">${esc(it.title)}</span>${compact?"":`<span class="sd" style="display:block">${esc(it.detail||TYPE[it.type][0])}</span>`}</span>${durCell(s,it)}</button>
    ${s===T?`<button class="chk ${on?"on":""}" data-toggle="${s}|${it.key}" aria-label="${on?"Mark not done":"Mark done"}: ${esc(it.title)}">${I.check}</button>`:`<span class="chk ro ${on?"on":""}" aria-label="${on?"Done":"Not done"}">${I.check}</span>`}</div>`}).join("");
  const meta=[...info.rest.filter(r=>!/legs/i.test(r)).map(r=>`<span class="chip">${esc(r.replace(/^no cardio$/i,"No cardio").replace(/^Rest, no cardio$/,"No cardio"))}</span>`),...info.notes.map(n=>`<span class="chip">${I.pin}${esc(n)}</span>`)];

}

let heroIdx=0, heroTouch=0;

function heroSlides(){
  const r=nextRace(); if(!r) return [];

  const cap={eyebrow:"",title:["Prairie Line Half Marathon","IRONMAN 70.3 Dallas","OKC Memorial Marathon","Full IRONMAN"][i],

function vHero(){
  const sl=heroSlides(); if(!sl.length) return "";
  heroIdx=Math.min(heroIdx,sl.length-1);
  return `<section class="hero-c" aria-label="Season highlights"><div class="hero-s" id="heroS">${sl.map((x,i)=>`<article class="slide" ${x.go?`data-go="${x.go}" role="button" tabindex="0"`:""} aria-label="${esc(x.title)}">
      ${x.img?`<img src="${x.img}" alt="" loading="${i?"lazy":"eager"}" onerror="this.style.display='none'">`:`<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${SCENES[x.scene]}</svg>`}
      <div class="shade"></div><span class="hchip num">${esc(x.chip)}</span>${assetsNS&&i===0&&!x.img?`<button class="addph" data-addphoto="${x.race}">+ Add race photos</button>`:""}

    ${sl.length>1?`<div class="dots">${sl.map((_,i)=>`<button data-hero="${i}" aria-label="Show slide ${i+1}" class="${i===heroIdx?"on":""}"></button>`).join("")}</div>`:""}</section>`;
}
function bindHero(){
  const el=document.getElementById("heroS"); if(!el) return;
  el.scrollLeft=heroIdx*el.clientWidth;
  let t=null;
  el.addEventListener("scroll",()=>{clearTimeout(t);t=setTimeout(()=>{heroIdx=Math.round(el.scrollLeft/el.clientWidth);document.querySelectorAll(".dots button").forEach((b,i)=>b.classList.toggle("on",i===heroIdx))},60)},{passive:true});
  ["pointerdown","touchstart","wheel"].forEach(ev=>el.addEventListener(ev,()=>heroTouch=Date.now(),{passive:true}));
}
setInterval(()=>{
  const el=document.getElementById("heroS"); if(!el||sheet||modal||document.hidden||Date.now()-heroTouch<8000) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const n=el.children.length; if(n<2) return;
  heroIdx=(heroIdx+1)%n; el.scrollTo({left:heroIdx*el.clientWidth,behavior:"smooth"});
},5500);

/* ---------- resting heart rate ---------- */
function rhrEntries(from,to){const o=[];for(let s=from;s<=to;s=addDays(s,1)){const e=sleepOf(s);if(e&&e.rhr)o.push([s,e.rhr])}return o}
function rhrAlert(){
  const today=sleepOf(T); if(!today||!today.rhr) return null;
  const prev=rhrEntries(addDays(T,-14),addDays(T,-1)).slice(-7); if(prev.length<3) return null;
  const avg=mean(prev.map(x=>x[1])), d=today.rhr-avg; return d>=5?{d:Math.round(d),avg:Math.round(avg),now:today.rhr}:null;
}
function rhrCard(){const a=rhrAlert();return a?`<div class="warn">${I.sleep}<div><b>Resting heart rate is up ${a.d} bpm.</b> ${a.now} bpm this morning vs. your ${a.avg} bpm average. Think about making today easy.</div></div>`:""}

/* ---------- Monday recap ---------- */
function vRecap(){

  for(let i=0;i<7;i++){const s=addDays(lw,i);dayItems(s).forEach(it=>{wn++;if(!isDone(s,it.key))return;wd++;
    const lg=logOf(s,it.key)||{};
    if(it.type==="bike"||it.type==="brick"||(it.type==="race"&&lg.bike)){const b=lg.bike;bikeH+=b&&b.sec?b.sec/3600:(it.type==="brick"?it.min*0.8:it.type==="race"?0:it.min)/60;if(b&&b.place==="indoor")ind++;else if(b&&b.place==="outdoor")out++}})}
  const nights=[];for(let i=0;i<7;i++){const e=sleepOf(addDays(lw,i));if(e)nights.push(e)}
  const sAvg=nights.length?mean(nights.map(e=>e.h)):null, atGoal=nights.filter(e=>e.h>=goal()).length;
  const r1=rhrEntries(lw,addDays(lw,6)), r0=rhrEntries(addDays(lw,-7),addDays(lw,-1));
  const rAvg=r1.length?Math.round(mean(r1.map(x=>x[1]))):null, rPrev=r0.length?Math.round(mean(r0.map(x=>x[1]))):null;
  const bms=["bike","swim","run"].flatMap(sp=>benchResults(sp).filter(r=>r.date>=lw&&r.date<=addDays(lw,6)).map(r=>BINFO[sp].name.split(" · ")[1]+" "+benchFmt(sp,r.v)));
  const tw=mondayOf(T); let longest=null;
  for(let i=0;i<7;i++)dayItems(addDays(tw,i)).forEach(it=>{if((it.type==="bike"||it.type==="brick")&&(!longest||it.min>longest.min))longest=it});
  const pd=weekHours(lw), dn=weekDone(lw), pct=pd?Math.round(dn/pd*100):0;
  return `<div class="sec"><h2 class="sech">Last week</h2><span class="sub num">${nice(lw,false)} – ${nice(addDays(lw,6),false)}</span></div>
  <div class="card recap">

      <div><span class="sub">On the bike</span><b class="num">${fmtHrs(bikeH)}</b><small>${ind||out?`${out} outdoor · ${ind} indoor`:"Bike first"}</small></div>
      <div><span class="sub">Sleep</span><b class="num">${sAvg?fmtH(sAvg):"—"}</b><small>${nights.length?atGoal+" of 7 nights at goal":"No nights logged"}</small></div>
      <div><span class="sub">Resting HR</span><b class="num">${rAvg?rAvg+" bpm":"—"}</b><small>${rAvg&&rPrev?(rAvg<rPrev?"Down "+(rPrev-rAvg)+" from the week before":rAvg>rPrev?"Up "+(rAvg-rPrev)+" from the week before":"Same as the week before"):"Log it in Sleep"}</small></div>

    <div class="rnext"><span class="pill ${kindCls(weekKind(tw))}">${weekKind(tw)}</span><span>This week: <b class="num">${fmtHrs(weekHours(tw))}</b> planned${longest?` · longest ride ${longest.type==="brick"?esc(longest.detail.split(" ride")[0]):durLabel(longest)}`:""}</span></div>
  </div>`;
}

/* ---------- readiness + next benchmark ---------- */
function readiness(){
  const e=sleepOf(T); if(!e) return null;
  let major=0,minor=0; const chips=[];
  if(e.h<goal()-1.5){major++;chips.push(["Sleep "+fmtH(e.h),"bad"])} else if(e.h<goal()){minor++;chips.push(["Sleep "+fmtH(e.h),"meh"])} else chips.push(["Sleep "+fmtH(e.h),"ok"]);
  if(e.q<=2){minor++;chips.push([QUAL[e.q-1]+" sleep","meh"])} else chips.push([QUAL[e.q-1]+" sleep",e.q>=4?"ok":"neutral"]);
  if(e.rhr){const prev=rhrEntries(addDays(T,-14),addDays(T,-1)).slice(-7);
    if(prev.length>=3){const avg=Math.round(mean(prev.map(x=>x[1]))),d=e.rhr-avg;
      if(d>=7){major++;chips.push([`Resting HR ${e.rhr} (avg ${avg})`,"bad"])} else if(d>=5){minor++;chips.push([`Resting HR ${e.rhr} (avg ${avg})`,"meh"])} else chips.push([`Resting HR ${e.rhr} (avg ${avg})`,"ok"])}
    else chips.push([`Resting HR ${e.rhr}`,"neutral"])}
  if(twoBad()){major++;chips.push(["2 rough nights in a row","bad"])}
  const lvl=major>=2?"rest":major||minor>=2?"easy":"go";
  const T_={go:["Ready to train","Go ahead with today's plan."],easy:["Take it easier","Keep the hard parts at easy effort, or shorten today's sessions."],rest:["Consider rest","Swap today's hard session for rest or an easy spin."]}[lvl];
  return {lvl,title:T_[0],advice:T_[1],chips};
}

  return `<div class="card ready rd-${r.lvl}"><div class="row" style="align-items:flex-start"><span class="rdot"></span><div class="grow"><div class="eyebrow">Readiness</div><div class="rt">${r.title}</div><div class="sub" style="margin-top:2px;line-height:1.45">${r.advice}</div>

}

function kindCls(k){return k==="Build"?"":k==="Race week"?"r":k==="Taper"?"o":"v"}

}

function sleepChart(nights){
  const W=400,H=170,pl=28,pr=8,pt=14,pb=24,max=Math.max(10,...nights.map(n=>n[1]?n[1].h:0));
  const bw=(W-pl-pr)/nights.length, y=v=>pt+(max-v)/max*(H-pt-pb), base=H-pb;
  const g=goal();
  let bars="";const hits=[];

    if(e){const top=y(e.h),r=Math.min(4,w/2);bars+=`<path d="M${x} ${base}V${top+r}Q${x} ${top} ${x+r} ${top}H${x+w-r}Q${x+w} ${top} ${x+w} ${top+r}V${base}Z" fill="var(--sleep)" fill-opacity="${e.h>=g?1:.45}"/>`;hits.push([x+w/2,top,d,fmtH(e.h)+" · "+QUAL[e.q-1]])}

function weightChart(){

function getItem(s,k){return dayItems(s).find(x=>x.key===k)}
/* ---------- logging what you did ---------- */
const SPORT={run:{name:"Run",unit:"mi",c:"var(--run)"},bike:{name:"Ride",unit:"mi",c:"var(--bike)"},swim:{name:"Swim",unit:"yd",c:"var(--swim)"},lift:{name:"Lift",unit:"",c:"var(--lift)"}};
function partsOf(it){
  if(it.type==="brick") return ["bike","run"];
  if(it.type==="race") return /IRONMAN/.test(it.title)?["swim","bike","run"]:["run"];
  return [it.type];
}
function planDist(it,sp){
  if(it.type==="race"){const full=/Full/.test(it.title),half=/70\.3/.test(it.title);
    if(sp==="swim")return full?4224:2112; if(sp==="bike")return full?112:56; return /Half Marathon/.test(it.title)||half?13.1:26.2;}
  if(it.type==="brick") return "";
  let m;
  if(sp==="run"&&(m=/(\d+(?:\.\d)?)(?:–\d+(?:\.\d)?)? mi\b/.exec(it.text))) return +m[1];
  if(sp==="swim"&&(m=/([\d,]{3,}) yd/.exec(it.text))) return +m[1].replace(/,/g,"");
  if(sp==="bike"&&it.bench) return 25;
  return "";
}
function logOf(s,k){return ((S.days[s]||{}).log||{})[k]||null}
function fmtDur(sec){if(!sec)return "—";const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),x=Math.round(sec%60);return h?h+":"+String(m).padStart(2,"0")+":"+String(x).padStart(2,"0"):m+":"+String(x).padStart(2,"0")}
function shortDur(sec){const m=Math.round(sec/60);return m>=60?Math.floor(m/60)+"h"+(m%60?" "+m%60+"m":""):m+"m"}
function durCell(s,it){
  const lg=logOf(s,it.key);
  if(!lg) return `<span class="dur num">${durLabel(it)}</span>`;
  const ps=Object.values(lg), sec=ps.reduce((a,p)=>a+(p.sec||0),0), hr=(ps.find(p=>p.avg)||{}).avg, mph=(lg.bike||{}).mph;
  return `<span class="dur num logged">${sec?shortDur(sec):"Logged"}${mph?`<small style="color:var(--lime)">${mph} mph</small>`:""}${hr?`<small>${hr} bpm</small>`:""}</span>`;
}
function logForm(it,lg){
  return partsOf(it).map(sp=>{const e=(lg||{})[sp]||{}, P=SPORT[sp], pre="f-"+sp+"-";
    const h=e.sec?Math.floor(e.sec/3600):"", m=e.sec?Math.floor(e.sec%3600/60):"", x=e.sec?Math.round(e.sec%60):"";

      <div class="lgrid">
        <label class="span2">Time<span class="hms"><input id="${pre}h" inputmode="numeric" placeholder="h" value="${h}" aria-label="Hours"><b>:</b><input id="${pre}m" inputmode="numeric" placeholder="min" value="${m}" aria-label="Minutes"><b>:</b><input id="${pre}s" inputmode="numeric" placeholder="sec" value="${x}" aria-label="Seconds"></span></label>
        ${P.unit?`<label>Dist (${P.unit})<input id="${pre}dist" inputmode="decimal" value="${dist}" placeholder="${P.unit}"></label>`:""}
        ${sp==="bike"?`<label>Avg mph<input id="${pre}mph" inputmode="decimal" value="${e.mph||""}" placeholder="${e.sec&&e.dist?(e.dist/(e.sec/3600)).toFixed(1):"mph"}"></label>`:""}

      </div></div>`}).join("");
}
function readOnlyLog(it,lg,done){

function saveLog(){
  if(sheet.date!==T) return;
  const it=getItem(sheet.date,sheet.key), out={}, err=document.getElementById("ferr");
  const num=id=>{const v=(document.getElementById(id)||{}).value;if(v==null||String(v).trim()==="")return null;const n=parseFloat(String(v).replace(",","."));return isNaN(n)?NaN:n};
  for(const sp of partsOf(it)){
    const pre="f-"+sp+"-", h=num(pre+"h")||0, m=num(pre+"m")||0, x=num(pre+"s")||0, sec=Math.round(h*3600+m*60+x);
    const e={sec}, dist=num(pre+"dist"), avg=num(pre+"avg"), mph=sp==="bike"?num(pre+"mph"):null;
    if([h,m,x,dist,avg,mph].some(v=>Number.isNaN(v))){err.textContent="Use numbers only in the "+SPORT[sp].name.toLowerCase()+" fields.";return}
    if(dist)e.dist=dist; if(avg)e.avg=Math.round(avg);
    if(sp==="bike"){
      if(mph!=null&&(mph<3||mph>45)){err.textContent="Average mph should be between 3 and 45.";return}
      if(mph){e.mph=Math.round(mph*10)/10; if(!e.dist&&sec) e.dist=Math.round(mph*sec/3600*10)/10;}
      else if(e.dist&&sec) e.mph=Math.round(e.dist/(sec/3600)*10)/10;
    }
    if(sp==="bike"){const pb=document.querySelector("[data-placeseg] [aria-pressed=\"true\"]");if(pb)e.place=pb.dataset.place}
    if(e.avg&&(e.avg<30||e.avg>230)){err.textContent="Heart rate should be between 30 and 230 bpm.";return}
    if(sec||e.avg||e.dist) out[sp]=e;
  }
  if(!Object.keys(out).length){err.textContent="Enter at least a time, or use Mark done.";return}
  const d=day(sheet.date); d.log=d.log||{}; d.log[sheet.key]=out;
  d.done=d.done||{}; d.done[sheet.key]=d.done[sheet.key]||Date.now();
  persist("d"+sheet.date); sheet=null; render();
}

/* ---------- benchmarks ---------- */
const BINFO={bike:{name:"Bike · 25 mi",what:"Average mph",better:"high"},swim:{name:"Swim · 1,000 yd",what:"Average per 100 yd",better:"low"},run:{name:"Run · 5K",what:"Fastest time",better:"low"}};
let benchSched=null;
function benchDates(sp){
  if(!benchSched){benchSched={bike:[],swim:[],run:[]};let s="2026-10-27";while(s<=PLAN_END){dayItems(s).forEach(it=>{if(it.bench)benchSched[it.bench].push([s,it.key])});s=addDays(s,1)}}
  return benchSched[sp];
}
function benchResults(sp){
  return benchDates(sp).map(([s,k])=>{const e=(logOf(s,k)||{})[sp];if(!e||!e.sec)return null;
    let v;
    if(sp==="bike") v=e.mph||(e.dist||25)/(e.sec/3600);
    if(sp==="swim") v=e.sec/((e.dist||1000)/100);
    if(sp==="run") v=e.dist&&Math.abs(e.dist-3.107)>0.05?e.sec*3.107/e.dist:e.sec;
    return {date:s,key:k,v,avg:e.avg};
  }).filter(Boolean);
}
function benchFmt(sp,v){return sp==="bike"?v.toFixed(1)+" mph":sp==="swim"?paceFmt("swim",v).replace(" /100yd","")+" /100":fmtDur(v)}
function benchBlock(sp){
  const B=BINFO[sp], res=benchResults(sp), hiBetter=B.better==="high";
  const best=res.length?res.reduce((a,r)=>(hiBetter?r.v>a.v:r.v<a.v)?r:a):null;
  const next=benchDates(sp).find(([s])=>s>=T&&!logOf(s,benchDates(sp).find(x=>x[0]===s)[1]));
  let change="";
  if(res.length>=2){const a=res[0].v,b=res[res.length-1].v,better=hiBetter?b>a:b<a,d=Math.abs(b-a);
    const dtxt=sp==="bike"?d.toFixed(1)+" mph":sp==="swim"?Math.round(d)+" sec/100":fmtDur(d);
    change=`<span class="pill ${d<0.01*a?"g":better?"":"o"}">${d<0.01*a?"About the same":(better?(hiBetter?"+":"−"):(hiBetter?"−":"+"))+dtxt+" since "+nice(res[0].date,false)}</span>`;}
  return `<div class="bblock"><div class="row"><div class="grow"><div class="tl" style="color:${SPORT[sp].c}">${B.name}</div><div class="sub">${B.what}${best&&sp==="run"?" (best)":""}</div></div>
    <div style="text-align:right"><div class="tv num">${best?benchFmt(sp,best.v):"—"}</div>${best&&res.length>1?`<div class="sub">Best</div>`:""}</div></div>
    ${res.length?`<div class="bhist">${res.map(r=>`<button class="chip num" data-open="${r.date}|${r.key}" ${r===best?'style="color:var(--fg);border-color:var(--line2)"':""}>${nice(r.date,false)} · ${benchFmt(sp,r.v)}</button>`).join("")}</div>`:""}
    <div class="row" style="margin-top:8px;flex-wrap:wrap;gap:8px">${change}${next?`<button class="btn ghost sm" data-open="${next[0]}|${next[1]}">Next: ${nice(next[0])}</button>`:res.length?"":`<span class="sub">No benchmark left in the plan.</span>`}</div></div>`;
}

/* ---------- progress ---------- */
function sessionsFor(sp){
  const out=[];
  Object.keys(S.days).sort().forEach(s=>{const lg=(S.days[s]||{}).log;if(!lg)return;
    for(const k in lg){const e=lg[k][sp];if(!e)continue;const it=getItem(s,k)||{title:"Session",text:""};
      const r={date:s,title:it.title,easy:/easy|zone 2|recovery|spin/i.test(it.text)&&!/tempo|threshold|sweet spot|race effort|race pace|marathon pace|test|benchmark/i.test(it.text),...e};
      if(sp==="bike"&&e.mph) r.pace=e.mph; else if(e.sec&&e.dist) r.pace=sp==="bike"?e.dist/(e.sec/3600):sp==="swim"?e.sec/(e.dist/100):e.sec/e.dist;
      out.push(r)}});
  return out;
}
function paceFmt(sp,v){if(v==null)return "—";if(sp==="bike")return v.toFixed(1)+" mph";const m=Math.floor(v/60),x=Math.round(v%60);return (x===60?(m+1)+":00":m+":"+String(x).padStart(2,"0"))+(sp==="swim"?" /100yd":" /mi")}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function compare(vals){ // older half vs newer half of the last 10
  const v=vals.slice(-10); if(v.length<4) return null;
  const h=Math.floor(v.length/2); return [mean(v.slice(0,v.length-h)),mean(v.slice(v.length-h))];
}
function trendRow(label,pair,fmt,betterWhenLower,n){
  if(!pair) return `<div class="trow"><div class="grow"><div class="tl">${label}</div><div class="sub">Needs 4 or more logged sessions${n?` (${n} so far)`:""}.</div></div><span class="pill g">Not enough data</span></div>`;
  const [a,b]=pair, ch=(b-a)/a, same=Math.abs(ch)<0.01, better=betterWhenLower?b<a:b>a;
  const word=label==="Pace"||label==="Speed"?(better?"Faster":"Slower"):(better?"Lower":"Higher");
  return `<div class="trow"><div class="grow"><div class="tl">${label}</div><div class="num tv">${fmt(a)} <span class="sub">→</span> ${fmt(b)}</div></div><span class="pill ${same?"g":better?"":"o"}">${same?"About the same":word+" "+Math.abs(ch*100).toFixed(0)+"%"}</span></div>`;
}
function vProgress(){
  const sp=progSport, all=sessionsFor(sp).filter(r=>sp!=="bike"||progPlace==="all"||(r.place||"outdoor")===progPlace), list=progEasy?all.filter(r=>r.easy):all, P=SPORT[sp];
  const withPace=list.filter(r=>r.pace!=null), withHr=list.filter(r=>r.avg);
  const totSec=list.reduce((a,r)=>a+(r.sec||0),0), totDist=list.reduce((a,r)=>a+(r.dist||0),0);
  const lowerBetter=sp!=="bike";
  return `
  <header class="hdr"><div class="grow"><div class="eyebrow">Run · Bike · Swim</div><h2>Progress</h2></div></header>
  <div class="row" style="flex-wrap:wrap;gap:10px"><div class="seg" role="group" aria-label="Sport">${["run","bike","swim"].map(k=>`<button data-psport="${k}" aria-pressed="${sp===k}">${SPORT[k].name}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Which sessions" style="margin-left:auto"><button data-peasy="0" aria-pressed="${!progEasy}">All</button><button data-peasy="1" aria-pressed="${progEasy}">Easy only</button></div></div>
  ${sp==="bike"?`<div class="row"><div class="seg" role="group" aria-label="Indoor or outdoor">${[["all","All rides"],["outdoor","Outdoor"],["indoor","Indoor"]].map(([k,l])=>`<button data-pplace="${k}" aria-pressed="${progPlace===k}">${l}</button>`).join("")}</div></div>`:""}
  <div class="card"><div class="eyebrow" style="margin-bottom:2px">Benchmark</div>${benchBlock(sp==="bike"?"bike":sp)}</div>
  <div class="card"><div class="stats"><div><span class="sub">Sessions</span><b class="num">${list.length}</b></div><div><span class="sub">Time</span><b class="num">${totSec?shortDur(totSec):"—"}</b></div><div><span class="sub">Distance</span><b class="num">${totDist?(sp==="swim"?Math.round(totDist).toLocaleString()+" yd":totDist.toFixed(1)+" mi"):"—"}</b></div></div></div>
  <div class="card"><div class="eyebrow" style="margin-bottom:4px">Am I improving?</div><div class="sub" style="margin-bottom:6px">Your newest logged ${P.name.toLowerCase()}s against the ones before them${progEasy?", easy sessions only":""}.</div>
    ${trendRow(sp==="bike"?"Speed":"Pace",compare(withPace.map(r=>r.pace)),v=>paceFmt(sp,v),lowerBetter,withPace.length)}
    ${trendRow("Avg heart rate",compare(withHr.map(r=>r.avg)),v=>Math.round(v)+" bpm",true,withHr.length)}
    <div class="sub" style="margin-top:10px;line-height:1.5">Compare like with like: "Easy only" gives the clearest heart-rate trend, since hard sessions push it up. A lower heart rate at the same or faster pace means your aerobic fitness is growing.</div></div>
  <div class="card"><div class="row" style="margin-bottom:6px"><div class="grow eyebrow">${sp==="bike"?"Speed":"Pace"}</div><span class="sub">${lowerBetter?"Higher on the chart is faster":""}</span></div>
    ${withPace.length>=2?trendChart(withPace.map(r=>({d:r.date,y:r.pace,t:paceFmt(sp,r.pace)+" · "+r.title})),{invert:lowerBetter,fmt:v=>paceFmt(sp,v).replace(/ .*/,""),color:P.c}):emptyChart(`Log 2 or more ${P.name.toLowerCase()}s with time and distance to see your ${sp==="bike"?"speed":"pace"}.`)}</div>
  <div class="card"><div class="row" style="margin-bottom:6px"><div class="grow eyebrow">Heart rate</div><span class="sub">Average per session</span></div>
    ${withHr.length>=2?trendChart(withHr.map(r=>({d:r.date,y:r.avg,t:`${r.avg} bpm avg · ${r.title}`})),{fmt:v=>Math.round(v)+"",color:"var(--race)"}):emptyChart(`Log heart rate on 2 or more ${P.name.toLowerCase()}s to see it here.`)}</div>
  <div class="card"><div class="eyebrow" style="margin-bottom:8px">All logged ${P.name.toLowerCase()}s</div>
    ${list.length?`<div class="llist">${list.slice().reverse().map(r=>`<div class="lrow"><div class="grow"><div style="font-weight:700">${nice(r.date)}</div><div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.title)}${sp==="bike"&&r.place?" · "+(r.place==="indoor"?"Indoor":"Outdoor"):""}</div></div><div class="num" style="text-align:right;font-size:13.5px;font-weight:700">${[fmtDur(r.sec),r.dist?(sp==="swim"?r.dist.toLocaleString()+" yd":r.dist+" mi"):"",r.pace!=null?paceFmt(sp,r.pace):""].filter(x=>x&&x!=="—").join(" · ")}<div class="hrline">${r.avg?r.avg+" bpm avg":""}</div></div></div>`).join("")}</div>`
      :`<div class="sub">Nothing logged yet. Open any ${P.name.toLowerCase()} in Workouts and fill in time, distance and heart rate.</div>`}</div>`;
}
function emptyChart(msg){return `<div class="sub" style="padding:18px 0;line-height:1.5">${msg}</div>`}
function trendChart(pts,o){
  const W=400,H=180,pl=44,pr=12,pt=14,pb=24;
  const ys=pts.flatMap(p=>[p.y,p.lo,p.hi].filter(v=>v!=null));
  let lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.12||Math.abs(hi)*.05||1;lo-=pad;hi+=pad;
  const t0=toUTC(pts[0].d),t1=toUTC(pts[pts.length-1].d),span=t1-t0||1;
  const x=d=>pts.length===1||t1===t0?(pl+W-pr)/2:pl+(toUTC(d)-t0)/span*(W-pl-pr);
  const y=v=>o.invert?pt+(v-lo)/(hi-lo)*(H-pt-pb):pt+(hi-v)/(hi-lo)*(H-pt-pb);
  // same-day sessions spread slightly so they don't overlap
  const seen={};const X=pts.map(p=>{const n=seen[p.d]=(seen[p.d]||0)+1;return x(p.d)+(n-1)*6});
  const line=pts.map((p,i)=>(i?"L":"M")+X[i].toFixed(1)+" "+y(p.y).toFixed(1)).join("");
  // least-squares trend
  const xs=pts.map(p=>(toUTC(p.d)-t0)/864e5),mx=mean(xs),my=mean(pts.map(p=>p.y));
  const den=xs.reduce((a,v)=>a+(v-mx)**2,0),slope=den?xs.reduce((a,v,i)=>a+(v-mx)*(pts[i].y-my),0)/den:0;
  const ty=v=>my+slope*(v-mx), xe=xs[xs.length-1];
  const ticks=[lo+(hi-lo)*.15,(lo+hi)/2,hi-(hi-lo)*.15];
  const hits=pts.map((p,i)=>[+X[i].toFixed(1),+y(p.y).toFixed(1),p.d,p.t]);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${o.fmt(v)}</text>`).join("")}
    <text x="${pl}" y="${H-6}" font-size="10" fill="var(--muted)">${nice(pts[0].d,false)}</text><text x="${W-pr}" y="${H-6}" font-size="10" fill="var(--muted)" text-anchor="end">${nice(pts[pts.length-1].d,false)}</text>
    ${pts.map((p,i)=>p.lo!=null&&p.hi!=null?`<line x1="${X[i]}" x2="${X[i]}" y1="${y(p.lo)}" y2="${y(p.hi)}" stroke="${o.color}" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>`:"").join("")}
    <path d="${line}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-opacity=".8"/>
    ${xe>0?`<line x1="${x(pts[0].d)}" y1="${y(ty(0))}" x2="${x(pts[pts.length-1].d)}" y2="${y(ty(xe))}" stroke="var(--fg)" stroke-opacity=".55" stroke-dasharray="5 4" stroke-width="1.5"/>`:""}
    ${pts.map((p,i)=>`<circle cx="${X[i]}" cy="${y(p.y)}" r="${i===pts.length-1?5:4}" fill="${o.color}" stroke="var(--card)" stroke-width="2"/>`).join("")}
    <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent" class="hit" data-pts='${esc(JSON.stringify(hits))}'/></svg><div class="tip" hidden></div></div>
    <div class="sub" style="margin-top:6px">Dashed line is your overall trend.</div>`;
}
function vNav(){return [["home","Home"],["workouts","Workouts"],["progress","Progress"],["sleep","Sleep"],["profile","Profile"]].map(([k,l])=>`<button data-tab="${k}" ${tab===k?'aria-current="page"':""}>${I[k]}${l}</button>`).join("")}
function vModal(){if(!modal)return"";const d=S.days[modal]||{};return `<div class="modal" data-mclose><div class="box" role="dialog" aria-label="Log weight"><div class="row"><h3 class="grow">Log weight · ${nice(modal)}</h3><button class="x" data-mclose aria-label="Close">${I.x}</button></div><div class="field"><input id="mwt" class="num" inputmode="decimal" style="width:120px" placeholder="${S.settings.unit==="lb"?"196.0":"89.0"}" value="${d.weight?(S.settings.unit==="lb"?(d.weight*2.20462).toFixed(1):(+d.weight).toFixed(1)):""}"><span class="sub">${S.settings.unit}</span><button class="btn lime" data-msave style="margin-left:auto">Save</button></div></div></div>`}

/* ---------- render + events ---------- */
const $app=document.getElementById("app"),$mini=document.getElementById("mini"),$nav=document.getElementById("nav"),$layer=document.getElementById("layer");
let qPick=null;
function render(){
  const fe=document.activeElement, fid=fe&&fe.id, sel=fe&&fe.selectionStart;
  $app.innerHTML=tab==="home"?vHome():tab==="workouts"?vWorkouts():tab==="progress"?vProgress():tab==="sleep"?vSleep():vProfile();
  $nav.innerHTML=vNav();
  $layer.innerHTML=(sheet?vSheet():"")+vModal();
  if(fid){const el=document.getElementById(fid);if(el&&el.tagName==="INPUT"&&el.type!=="time"){el.focus();try{el.setSelectionRange(sel,sel)}catch(e){}}}
  document.querySelectorAll(".hit").forEach(bindHover);
  if(tab==="home") bindHero();
}
function bindHover(hit){
  const pts=JSON.parse(hit.dataset.pts), svg=hit.ownerSVGElement, tip=svg.parentNode.querySelector(".tip"), vb=svg.viewBox.baseVal;
  const move=e=>{if(!pts.length)return;const r=svg.getBoundingClientRect();const sx=(e.clientX-r.left)/r.width*vb.width;let b=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-sx)<Math.abs(b[0]-sx))b=p});
    tip.hidden=false;tip.textContent=(hit.classList.contains("wkhit")?"Week of "+nice(b[2],false):nice(b[2]))+" · "+b[3];tip.style.left=Math.min(Math.max(b[0]/vb.width*r.width,70),r.width-70)+"px";tip.style.top=(b[1]/vb.height*r.height)+"px"};
  hit.addEventListener("pointermove",move);hit.addEventListener("pointerdown",move);
  hit.addEventListener("pointerleave",()=>{tip.hidden=true});
}
function toggle(s,k,v){const d=day(s);d.done=d.done||{};if(v===undefined)v=!d.done[k];if(v)d.done[k]=Date.now();else delete d.done[k];persist("d"+s)}
function parseW(v){const n=parseFloat(String(v).replace(",","."));if(!n||n<20||n>700)return null;return S.settings.unit==="lb"?n/2.20462:n}
function liveDur(){const el=document.getElementById("sdur"),a=document.getElementById("sbed"),b=document.getElementById("swake");if(el&&a&&b)el.textContent=fmtH(hoursBetween(a.value,b.value))}
document.addEventListener("click",e=>{
  const wh=e.target.closest(".wkhit");if(wh){const pts=JSON.parse(wh.dataset.pts),r=wh.ownerSVGElement.getBoundingClientRect(),sx=(e.clientX-r.left)/r.width*400;let b=pts[0];pts.forEach(p=>{if(Math.abs(p[0]-sx)<Math.abs(b[0]-sx))b=p});wkView=b[2];render();return}
  const b=e.target.closest("button,[data-mclose],[data-go]"); if(!b) return;
  const D=b.dataset;
  if(D.tab){tab=D.tab;wkView=null;sleepDay=null;try{history.replaceState(null,"","#"+tab)}catch(_){location.hash=tab}render();scrollTo(0,0);return}
  if(D.toggle){const[s,k]=D.toggle.split("|");if(s===T)toggle(s,k);render();return}
  if(D.open){const[s,k]=D.open.split("|");sheet={date:s,key:k};render();return}
  if(D.savelog!==undefined){saveLog();return}
  if(D.clearlog!==undefined){if(sheet.date!==T)return;const d=day(sheet.date);if(d.log)delete d.log[sheet.key];persist("d"+sheet.date);render();return}
  if(D.psport){progSport=D.psport;render();return}
  if(D.peasy){progEasy=D.peasy==="1";render();return}
  if(D.addphoto){photoRace=D.addphoto;document.getElementById("photoIn").click();return}
  if(D.delphoto){const[r,id]=D.delphoto.split("|");if(delArm===id){delArm=null;removePhoto(r,id)}else{delArm=id;render()}return}
  if(D.hero!==undefined){const el=document.getElementById("heroS");heroIdx=+D.hero;heroTouch=Date.now();el&&el.scrollTo({left:heroIdx*el.clientWidth,behavior:"smooth"});return}
  if(D.go){tab=D.go;sleepDay=null;render();scrollTo(0,0);return}
  if(D.week){wkView=D.week;render();return}
  if(D.sday){if(D.sday<=T){sleepDay=D.sday;qPick=null;render()}return}
  if(D.export!==undefined){exportData();return}
  if(D.import!==undefined){if(!importArm){importArm=true;render();setTimeout(()=>{importArm=false;render()},5000);return}importArm=false;document.getElementById("importIn").click();render();return}
  if(D.place){b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(D.pplace){progPlace=D.pplace;render();return}
  if(D.q){qPick=+D.q;b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));return}
  if(D.savesleep){const s=D.savesleep,bed=document.getElementById("sbed").value,wake=document.getElementById("swake").value,old=sleepOf(s)||{};
    const q=qPick||old.q||3, h=hoursBetween(bed,wake); if(h==null)return;
    const rv=parseInt(document.getElementById("srhr").value,10);day(s).sleep={bed,wake,h:+h.toFixed(2),q};if(rv>=25&&rv<=130)day(s).sleep.rhr=rv;qPick=null;persist("d"+s);render();return}
  if(D.goal){S.settings.sleepGoal=+D.goal;persist("settings");render();return}
  if(D.unit){S.settings.unit=D.unit;persist("settings");render();return}
  if(D.weight){modal=D.weight;render();setTimeout(()=>{const m=document.getElementById("mwt");m&&m.focus()},30);return}
  if(D.msave!==undefined){const w=parseW(document.getElementById("mwt").value);if(w){day(modal).weight=+w.toFixed(2);persist("d"+modal)}modal=null;render();return}
  if(D.mclose!==undefined&&(b.classList.contains("x")||e.target===b)){modal=null;render();return}
  if(D.close!==undefined){sheet=null;render();return}
});
let nt=null;
let importArm=false, backupMsg="";
async function exportData(){
  const json=JSON.stringify({app:"TriTime",version:1,saved:new Date().toISOString(),data:{days:S.days,settings:S.settings}});
  const name="TriTime-backup-"+todayStr()+".json", file=new File([json],name,{type:"application/json"});
  const mark=()=>{S.settings.lastBackup=todayStr();saveLocal()};
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});mark();backupMsg="Backup ready. Choose Save to Files to keep it.";render();return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();mark();backupMsg="Backup saved as "+name+".";render();
}
document.addEventListener("change",e=>{if(e.target.id!=="importIn")return;const f=e.target.files[0];e.target.value="";if(!f)return;
  f.text().then(t=>{const j=JSON.parse(t);if(!j||j.app!=="TriTime"||!j.data||typeof j.data.days!=="object")throw 0;
    S.days=j.data.days;S.settings=Object.assign({unit:"kg",sleepGoal:8},j.data.settings||{});saveLocal();Object.keys(scaledWk||{}).forEach(k=>delete scaledWk[k]);backupMsg="Backup restored from "+(j.saved||"").slice(0,10)+".";render()})
  .catch(()=>{backupMsg="That file isn't a TriTime backup.";render()})});
document.addEventListener("change",e=>{if(e.target.id==="photoIn"){const fs=[...e.target.files];e.target.value="";if(photoRace)addPhotos(photoRace,fs)}});
document.addEventListener("input",e=>{
  const t=e.target,D=t.dataset;
  if(t.id==="sbed"||t.id==="swake") liveDur();
  if(/^f-bike-(h|m|s|dist)$/.test(t.id)){const g=id=>parseFloat((document.getElementById(id)||{}).value)||0,sec=g("f-bike-h")*3600+g("f-bike-m")*60+g("f-bike-s"),d=g("f-bike-dist"),mp=document.getElementById("f-bike-mph");if(mp)mp.placeholder=sec&&d?(d/(sec/3600)).toFixed(1):"mph"}
  if(D.test){S.settings[D.test]=t.value;clearTimeout(nt);nt=setTimeout(()=>persist("settings"),600)}
  if(D.name!==undefined){S.settings.name=t.value;clearTimeout(nt);nt=setTimeout(()=>persist("settings"),600)}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="mwt")document.querySelector("[data-msave]").click();if(e.key==="Escape"){if(modal){modal=null;render()}else if(sheet){sheet=null;render()}}});
// roll over to the new day if the app stays open past midnight
function checkDay(){const t=todayStr();if(t!==T){T=t;wkView=null;sleepDay=null;render()}}
setInterval(checkDay,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkDay()});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TABS.includes(h)&&h!==tab){tab=h;render()}});
render();
</script>
